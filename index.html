<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로블록스 끝말잇기 검색기</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--pink:#ff7aa8;--green:#56d364;--yellow:#e3b341;--purple:#c297ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:1100px;margin:auto;padding:22px 12px 70px}h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;line-height:1.55}
.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);font-size:18px;padding:15px}.search button{border:0;border-radius:13px;background:var(--blue);font-size:16px;font-weight:800;padding:0 19px}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.quick button,.word{background:#21262d;border:1px solid var(--line);color:var(--text);cursor:pointer}.quick button{padding:7px 11px;border-radius:999px}.word{padding:8px 10px;border-radius:9px}.word:hover,.quick button:hover{border-color:var(--blue)}
.stats{color:var(--muted);font-size:13px;margin:10px 0 17px}.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.section h2{font-size:18px;margin:0 0 5px}.section p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 10px}.count{font-size:12px;color:var(--blue);margin-bottom:9px}.list{display:flex;flex-wrap:wrap;gap:7px;max-height:430px;overflow:auto}.attack h2{color:var(--pink)}.root h2{color:#a8d7ff}.cycle h2{color:var(--green)}.yield h2{color:var(--yellow)}.other h2{color:var(--purple)}.empty{color:var(--muted);padding:7px 0}
.note{font-size:12px;color:var(--muted);line-height:1.65;border-top:1px solid var(--line);margin-top:22px;padding-top:15px}
@media(max-width:600px){main{padding:18px 9px 55px}.list{max-height:340px}}
</style>
</head>
<body>
<main>
<h1>로블록스 끝말잇기 검색기</h1>
<div class="sub">전용 단어 목록 기준 · 공격 단어와 주요 루트 단어를 분리해서 표시</div>
<div class="search"><input id="q" placeholder="글자 또는 단어 입력 (예: 가, 제)" autocomplete="off"><button id="go">검색</button></div>
<div class="quick" id="quick"></div>
<div class="stats" id="stats">데이터 불러오는 중…</div>
<div id="results"></div>
<div class="note">이번 버전은 기존처럼 “끝 글자가 미확정이면 전부 루트”로 넣지 않습니다. 주요 루트 단어는 제공된 주요 루트 단어 파일에 실제로 들어 있는 단어만 표시합니다.</div>
</main>
<script>
let WORDS=[], TYPES=[];
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function makeSection(title, hint, items, cls){
 const s=document.createElement("section");s.className="section "+cls;
 s.innerHTML=`<h2>${esc(title)}</h2><p>${esc(hint)}</p><div class="count">${items.length.toLocaleString()}개</div>`;
 const l=document.createElement("div");l.className="list";
 if(!items.length)l.innerHTML='<div class="empty">없음</div>';
 else{
  items.slice(0,1000).forEach(({w})=>{const b=document.createElement("button");b.className="word";b.textContent=w;b.onclick=()=>{$("q").value=w.at(-1);search();window.scrollTo({top:0,behavior:"smooth"});};l.appendChild(b);});
  if(items.length>1000){const d=document.createElement("div");d.className="empty";d.textContent="처음 1,000개만 표시";l.appendChild(d);}
 }
 s.appendChild(l);return s;
}
function search(){
 const q=$("q").value.trim(), box=$("results");box.innerHTML="";
 if(!q){$("stats").textContent="검색할 글자나 단어를 입력하세요.";return;}
 const matches=[];
 for(let i=0;i<WORDS.length;i++)if(WORDS[i].startsWith(q))matches.push({w:WORDS[i],t:TYPES[i]});
 $("stats").textContent=`“${q}”로 시작하는 단어 ${matches.length.toLocaleString()}개`;
 const attacks=new Map(), root=[], cycle=[], yieldWords=[], other=[];
 for(const x of matches){
  if(x.t.startsWith("attack:")){const n=Number(x.t.split(":")[1]);if(!attacks.has(n))attacks.set(n,[]);attacks.get(n).push(x);}
  else if(x.t==="root")root.push(x);
  else if(x.t==="cycle")cycle.push(x);
  else if(x.t==="yield")yieldWords.push(x);
  else other.push(x);
 }
 [...attacks.keys()].sort((a,b)=>a-b).forEach(n=>box.appendChild(makeSection(`${n}수 이내 승리 공격 단어`,`${n}수 이내에 승리하는 것으로 판정된 공격 단어`,attacks.get(n),"attack")));
 box.appendChild(makeSection("주요 루트 단어","제공된 주요 루트 단어 목록에 포함된 단어만 표시",root,"root"));
 box.appendChild(makeSection("순환·돌림 단어","서로 왕복하는 2사이클 쌍으로 분리된 단어",cycle,"cycle"));
 box.appendChild(makeSection("양보·상대 우세 후보","상대에게 필승 구조를 넘기는 방향의 단어",yieldWords,"yield"));
 box.appendChild(makeSection("기타 미분류","현재 단순 승패 전파만으로 공격·주요 루트·순환으로 확정하지 않은 단어",other,"other"));
}
(async()=>{
 const d=await fetch("data.json").then(r=>r.json());WORDS=d.words;TYPES=d.types;
 $("stats").textContent=`전용 단어 ${WORDS.length.toLocaleString()}개 분석 완료`;
 ["가","제","락","다","륨","객"].forEach(x=>{const b=document.createElement("button");b.textContent=x;b.onclick=()=>{$("q").value=x;search()};$("quick").appendChild(b);});
 $("go").onclick=search;$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search();});
})().catch(e=>$("stats").textContent="데이터를 불러오지 못했습니다: "+e.message);
</script>
</body>
</html>
