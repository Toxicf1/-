<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>끝말잇기 AI</title><style>
body{margin:auto;max-width:900px;padding:20px;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}input,button{padding:12px;border-radius:10px;border:1px solid #30363d;font-size:16px}input{background:#161b22;color:white;flex:1}button{background:#58a6ff;font-weight:bold}.row{display:flex;gap:8px;margin:12px 0}.chat{height:400px;overflow:auto;border:1px solid #30363d;border-radius:12px;padding:10px}.m{padding:9px;margin:7px;border-radius:10px}.me{background:#1f6feb;text-align:right}.ai{background:#21262d}.sys{background:#332b1a;text-align:center}#need{font-size:18px}.tab{background:#21262d;color:white}.tab.on{background:#58a6ff;color:#111}.panel{display:none}.panel.on{display:block}.word{margin:3px;background:#21262d;color:white}
</style></head><body><h1>로블록스 끝말잇기 AI</h1><div><button class="tab on" onclick="show('game',this)">AI 대전</button><button class="tab" onclick="show('search',this)">단어 검색</button></div>
<div id="game" class="panel on"><p id="need">첫 단어를 입력해.</p><div class="chat" id="chat"></div><div class="row"><input id="move"><button onclick="play()">내기</button><button onclick="reset()">새 게임</button></div><p id="status"></p></div>
<div id="search" class="panel"><div class="row"><input id="q"><button onclick="search()">검색</button></div><p id="count"></p><div id="res"></div></div>
<script>
let W=[],S={},used=new Set(),need=null,over=false;
function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');b.classList.add('on')}
function vars(c){let a=new Set([c]);let e={"름":["늠","음"],"늠":["름"],"음":["름"],"륨":["늄","윰"],"늄":["륨","윰"],"윰":["륨","늄"],"락":["낙"],"낙":["락"],"류":["유"],"유":["류"],"료":["요"],"요":["료"],"력":["역"],"역":["력"],"령":["영"],"영":["령"],"리":["이"],"이":["리"]};(e[c]||[]).forEach(x=>a.add(x));return [...a]}
function cand(c,extra){let r=[],z=new Set();if(!c)return W.filter(w=>!used.has(w));for(let v of vars(c))for(let w of(S[v]||[]))if(!used.has(w)&&w!==extra&&!z.has(w)){z.add(w);r.push(w)}return r}
function reply(w){return cand(w.at(-1),w)}
function choose(){let cs=cand(need);if(!cs.length)return null;let best=[],score=-1e18;for(let w of cs.slice(0,8000)){let n=reply(w).length,s=n? -n:1e12;if(s>score){score=s;best=[w]}else if(s==score)best.push(w)}return best[Math.floor(Math.random()*best.length)]}
function msg(t,c){let d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function upd(){document.getElementById('need').innerHTML=need?'이어야 할 글자: <b>'+vars(need).join(' / ')+'</b>':'첫 단어를 입력해.'}
function ai(){let w=choose();if(!w){over=true;status.textContent='AI가 못 이음. 네 승리';msg('AI가 이을 수 없습니다. 네 승리','sys');return}used.add(w);need=w.at(-1);msg(w,'ai');upd();if(!cand(need).length){over=true;status.textContent='네가 못 이음. AI 승리';msg('네가 이을 수 없습니다. AI 승리','sys')}}
function play(){if(over)return;let w=move.value.trim();move.value='';if(!W.includes(w)){msg('등록되지 않은 단어','sys');return}if(used.has(w)){msg('이미 사용한 단어','sys');return}if(need&&!vars(need).some(v=>w.startsWith(v))){msg('두음법칙을 포함한 허용 글자로 시작해야 함: '+vars(need).join('/'),'sys');return}used.add(w);need=w.at(-1);msg(w,'me');upd();setTimeout(ai,200)}
function reset(){used=new Set();need=null;over=false;chat.innerHTML='';status.textContent='AI는 바로 이기는 수를 우선 찾고, 없으면 상대 선택지를 줄이는 수를 선택합니다.';upd();msg('시작 단어를 내면 이어갈게.','ai')}
function search(){let q=document.getElementById('q').value.trim(),a=W.filter(w=>w.startsWith(q));count.textContent=a.length+'개';res.innerHTML='';a.slice(0,1000).forEach(w=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{q.value=w.at(-1);search()};res.appendChild(b)})}
(async()=>{let d=await fetch('data.json').then(r=>r.json());W=d.words;for(let w of W)(S[w[0]]??=[]).push(w);reset()})()
</script></body></html>
